name: Publish reviewed Modelspage revision

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modelspage-production-publication
  cancel-in-progress: false

jobs:
  reviewed:
    if: github.repository == 'cogine-ai/modelspage' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      publish: ${{ steps.review.outputs.publish }}
    steps:
      - name: Require the current main commit and an exact merged PR
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$current" != "$COMMIT_SHA" ]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            pulls=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$COMMIT_SHA/pulls")
            publish=$(jq -r --arg sha "$COMMIT_SHA" --arg repo "$GITHUB_REPOSITORY" \
              'any(.[][]; .merged_at != null and .merge_commit_sha == $sha and .base.repo.full_name == $repo and .base.ref == "main")' <<< "$pulls")
            echo "publish=$publish" >> "$GITHUB_OUTPUT"
          fi
  publish:
    needs: reviewed
    if: needs.reviewed.outputs.publish == 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require explicit protected-environment publish enablement
        env:
          MODELSPAGE_PUBLISH_ENABLED: ${{ vars.MODELSPAGE_PUBLISH_ENABLED }}
        run: |
          if [ "$MODELSPAGE_PUBLISH_ENABLED" != 'true' ]; then
            echo 'Production publishing is disabled; configure the production environment before retrying.'
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run schema:check
      - run: bun run test:cogine
      - name: Verify current public revision and derive a fixed publication plan
        id: plan
        run: |
          commit_time=$(git show -s --format=%cI HEAD)
          bun cogine/scripts/production.ts prepare --published-at "$commit_time" --active-dir .modelspage/active
        env:
          MODELSPAGE_PUBLIC_BASE_URL: ${{ vars.MODELSPAGE_PUBLIC_BASE_URL }}
      - name: Build pinned reviewed inputs
        env:
          PUBLICATION_SEQUENCE: ${{ steps.plan.outputs.sequence }}
          PUBLICATION_TIME: ${{ steps.plan.outputs.published_at }}
          MODELSPAGE_INPUT_ENCRYPTION_KEY: ${{ secrets.MODELSPAGE_INPUT_ENCRYPTION_KEY }}
        run: |
          previous=()
          if [ -f .modelspage/active/catalog.json ]; then
            previous=(--previous .modelspage/active/catalog.json)
          fi
          bun cogine/src/cli.ts build --published-at "$PUBLICATION_TIME" --sequence "$PUBLICATION_SEQUENCE" --out-dir dist/production "${previous[@]}"
      - run: bun cogine/src/cli.ts validate --input dist/production
      - name: Require licensed usable C/P/N for the initial production release
        run: bun cogine/scripts/production.ts check --input dist/production --active-dir .modelspage/active
      - name: Refuse a build superseded by a newer main commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$current" = "$COMMIT_SHA"
      - name: Upload immutable objects and conditionally switch manifest
        run: bun cogine/src/cli.ts publish --input dist/production
        env:
          MODELSPAGE_PUBLISH_ENABLED: ${{ vars.MODELSPAGE_PUBLISH_ENABLED }}
          MODELSPAGE_PUBLIC_BASE_URL: ${{ vars.MODELSPAGE_PUBLIC_BASE_URL }}
          MODELSPAGE_R2_ACCOUNT_ID: ${{ vars.MODELSPAGE_R2_ACCOUNT_ID }}
          MODELSPAGE_R2_BUCKET: ${{ vars.MODELSPAGE_R2_BUCKET }}
          MODELSPAGE_R2_ACCESS_KEY_ID: ${{ secrets.MODELSPAGE_R2_ACCESS_KEY_ID }}
          MODELSPAGE_R2_SECRET_ACCESS_KEY: ${{ secrets.MODELSPAGE_R2_SECRET_ACCESS_KEY }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        # Failed licensing/readiness checks must not expose private C/P candidates.
        if: success()
        with:
          name: reviewed-production-build
          path: dist/production
          if-no-files-found: warn
          retention-days: 30
