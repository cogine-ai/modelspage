name: Modelspage PR validation

on:
  pull_request:
  push:
    branches: [main, 'cogine/**']
  workflow_dispatch:
    inputs:
      network_diagnostic:
        description: Run the public-origin transport diagnostic instead of catalog validation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: modelspage-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'workflow_dispatch' || !inputs.network_diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fetch the pinned upstream input for catalog validation
        run: |
          pinned=$(jq -er '.commit | select(type == "string" and test("^[a-f0-9]{40}$"))' cogine/upstream.lock.json)
          git fetch --no-tags --depth=1 origin "$pinned"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run typecheck:web
      - run: bun run schema:check
      - run: bun cogine/web/schema.ts --check
      - run: bun validate
      - name: Verify original API against the fixed upstream baseline
        run: |
          pinned=$(jq -er '.commit | select(type == "string" and test("^[a-f0-9]{40}$"))' cogine/upstream.lock.json)
          bun run v1:check "$pinned"
      - run: bun run test:cogine
      - run: bun run build:fixture
      - run: bun cogine/src/cli.ts validate --input dist/fixture
      - run: bun run publish:dry-run
      - run: bun run web:build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fixture-build-and-reports
          path: dist/fixture
          if-no-files-found: warn
          retention-days: 7

  network-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.network_diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Compare public DNS, address families and HTTP clients without credentials
        run: bun --no-env-file cogine/scripts/network-diagnostic.ts --out-dir .modelspage/network-diagnostic
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Exercise the production preparation path against both public origins
        run: |
          commit_time=$(git show -s --format=%cI HEAD)
          for host in models.cogine.ai models.cogine.app; do
            MODELSPAGE_PUBLIC_BASE_URL="https://$host" bun --no-env-file cogine/scripts/production.ts prepare --published-at "$commit_time" --active-dir ".modelspage/network-prepare/$host"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: public-origin-network-diagnostic
          path: .modelspage/network-diagnostic
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
