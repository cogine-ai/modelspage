name: Request the unified daily review

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modelspage-daily-review
  cancel-in-progress: false

jobs:
  request:
    if: github.repository == 'cogine-ai/modelspage' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the single daily collector and upstream proposal
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh workflow run modelspage-collect.yml --ref "$DEFAULT_BRANCH"
